name: daily-prices
on:
  schedule:
    - cron: "45 6 * * 1-5"   # 台灣時間每週一至五 14:45
  workflow_dispatch:
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python fetch_prices.py
      - name: 存檔
        if: always()
        run: |
          git config user.name "price-bot"
          git config user.email "bot@users.noreply.github.com"
          git add data/prices.json || true
          git diff --cached --quiet || (git commit -m "update prices" && git push)
